<div class="memento-mori" id="memento-mori">
  <span class="mm-label"><em>{{ T "memento-mori" | humanize }}</em></span>
  <div class="mm-display">
    <span class="mm-large" id="mm-large">—</span>
    <span class="mm-small" id="mm-small">—</span>
  </div>
  <span class="mm-date" id="mm-date"></span>
</div>

<style>

.memento-mori {
  text-align: center;
  max-width: 400px;
  margin: 1em auto 1.5em auto;
  color: var(--footnote-color);
}

.mm-label {
  font-family: var(--font-serif);
  font-size: 0.8em;
  display: block;
  margin-bottom: 0.3em;
}

.mm-display {
  display: flex;
  flex-direction: column;
  gap: 0.15em;
}

.mm-large {
  font-family: var(--font-sans);
  font-size: 0.9em;
  letter-spacing: 0.04em;
}

.mm-small {
  font-family: var(--font-sans);
  font-size: 0.75em;
  opacity: 0.6;
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
}

.mm-date {
  display: block;
  font-family: var(--font-sans);
  font-size: 0.72em;
  opacity: 0;
  margin-top: 0.4em;
  transition: opacity 0.2s ease;
  font-style: italic;
}

.memento-mori:hover .mm-date {
  opacity: 0.7;
}

</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const mmLarge = document.querySelector('#mm-large');
  const mmSmall = document.querySelector('#mm-small');
  const mmDate = document.querySelector('#mm-date');
  const targetDate = new Date('2075-09-15T00:00:00Z').getTime();

  mmDate.textContent = 'est. September 15, 2075';

  const updateTimer = () => {
    const now = new Date().getTime();
    const timeLeft = Math.floor((targetDate - now) / 1000);

    if (timeLeft <= 0) {
      mmLarge.textContent = 'time is up';
      mmSmall.textContent = '';
      return;
    }

    const secondsPerDay = 86400;
    const secondsPerMonth = secondsPerDay * 30.436875;
    const secondsPerYear = secondsPerDay * 365.2425;

    const years = Math.floor(timeLeft / secondsPerYear);
    const months = Math.floor((timeLeft % secondsPerYear) / secondsPerMonth);
    const days = Math.floor((timeLeft % secondsPerMonth) / secondsPerDay);
    const hours = Math.floor((timeLeft % secondsPerDay) / 3600);
    const minutes = Math.floor((timeLeft % 3600) / 60);
    const seconds = timeLeft % 60;

    const pad = n => String(n).padStart(2, '0');

    mmLarge.textContent = `${years}y  ${pad(months)}m  ${pad(days)}d`;
    mmSmall.textContent = `${pad(hours)}h  ${pad(minutes)}m  ${pad(seconds)}s`;
  };

  updateTimer();
  setInterval(updateTimer, 1000);
});
</script>
