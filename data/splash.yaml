- "Augustine's I law: The best way to make a silk purse from a sow's ear is to begin with a silk sow. The same is true of money."
- "Augustine's II law: If today were half as good as tomorrow is supposed to be, it would probably be twice as good as yesterday was."
- "Augustine's III law: There are no lazy veteran lion hunters."
- "Augustine's IV law: If you can afford to advertise, you don't need to."
- "Augustine's IX law: Acronyms and abbreviations should be used to the maximum extent possible to make trivial ideas profound...Q.E.D."
- "Augustine's L law: The average regulation has a life span one-fifth as long as a chimpanzee's and one-tenth as long as a human's, but four times as long as the official's who created it."
- "Augustine's LI law: By the time of the United States Tricentennial, there will be more government workers than there are workers."
- "Augustine's LII law: People working in the private sector should try to save money. There remains the possibility that it may someday be valuable again."
- "Augustine's V law: One-tenth of the participants produce over one-third of the output. Increasing the number of participants merely reduces the average output."
- "Augustine's VI law: A hungry dog hunts best. A hungrier dog hunts even better."
- "Augustine's VII law: Decreased business base increases overhead. So does increased business base."
- "Augustine's VIII law: The most unsuccessful four years in the education of a cost-estimator is fifth grade arithmetic."
- "Augustine's X law: Bulls do not win bullfights; people do. People do not win people fights; lawyers do."
- "Augustine's XI law: If the Earth could be made to rotate twice as fast, managers would get twice as much done. If the Earth could be made to rotate twenty times as fast, everyone else would get twice as much done since all the managers would fly off."
- "Augustine's XII law: It costs a lot to build bad products."
- "Augustine's XIII law: There are many highly successful businesses in the United States. There are also many highly paid executives. The policy is not to intermingle the two."
- "Augustine's XIV law: After the year 2015, there will be no airplane crashes. There will be no takeoffs either, because electronics will occupy 100 percent of every airplane's weight."
- "Augustine's XIX law: Although most products will soon be too costly to purchase, there will be a thriving market in the sale of books on how to fix them."
- "Augustine's XL law: Most projects start out slowly, and then sort of taper off."
- "Augustine's XLI law: The more one produces, the less one gets."
- "Augustine's XLII law: Simple systems are not feasible because they require infinite testing."
- "Augustine's XLIII law: Hardware works best when it matters the least."
- "Augustine's XLIV law: Aircraft flight in the 21st century will always be in a westerly direction, preferably supersonic, crossing time zones to provide the additional hours needed to fix the broken electronics."
- "Augustine's XLIX law: Regulations grow at the same rate as weeds."
- "Augustine's XLV law: One should expect that the expected can be prevented, but the unexpected should have been expected."
- "Augustine's XLVI law: A billion saved is a billion earned."
- "Augustine's XLVII law: Two-thirds of the Earth's surface is covered with water. The other third is covered with auditors from headquarters."
- "Augustine's XLVIII law: The more time you spend talking about what you have been doing, the less time you have to spend doing what you have been talking about. Eventually, you spend more and more time talking about less and less until finally you spend all your time talking about nothing."
- "Augustine's XV law: The last 10 percent of performance generates one-third of the cost and two-thirds of the problems."
- "Augustine's XVI law: In the year 2054, the entire defense budget will purchase just one aircraft. This aircraft will have to be shared by the Air Force and Navy 3-1/2 days each per week except for leap year, when it will be made available to the Marines for the extra day."
- "Augustine's XVII law: Software is like entropy. It is difficult to grasp, weighs nothing, and obeys the Second Law of Thermodynamics; i.e., it always increases."
- "Augustine's XVIII law: It is very expensive to achieve high unreliability. It is not uncommon to increase the cost of an item by a factor of ten for each factor of ten degradation accomplished."
- "Augustine's XX law: In any given year, Congress will appropriate the amount of funding approved the prior year plus three-fourths of whatever change the administration requests, minus 4-percent tax."
- "Augustine's XXI law: It's easy to get a loan unless you need it."
- "Augustine's XXII law: If stock market experts were so expert, they would be buying stock, not selling advice."
- "Augustine's XXIII law: Any task can be completed in only one-third more time than is currently estimated."
- "Augustine's XXIV law: The only thing more costly than stretching the schedule of an established project is accelerating it, which is itself the most costly action known to man."
- "Augustine's XXIX law: Executives who do not produce successful results hold on to their jobs only about five years. Those who produce effective results hang on about half a decade."
- "Augustine's XXV law: A revised schedule is to business what a new season is to an athlete or a new canvas to an artist."
- "Augustine's XXVI law: If a sufficient number of management layers are superimposed on each other, it can be assured that disaster is not left to chance."
- "Augustine's XXVII law: Rank does not intimidate hardware. Neither does the lack of rank."
- "Augustine's XXVIII law: It is better to be the reorganizer than the reorganizee."
- "Augustine's XXX law: By the time the people asking the questions are ready for the answers, the people doing the work have lost track of the questions."
- "Augustine's XXXI law: The optimum committee has no members."
- "Augustine's XXXII law: Hiring consultants to conduct studies can be an excellent means of turning problems into gold, your problems into their gold."
- "Augustine's XXXIII law: Fools rush in where incumbents fear to tread."
- "Augustine's XXXIV law: The process of competitively selecting contractors to perform work is based on a system of rewards and penalties, all distributed randomly."
- "Augustine's XXXIX law: Never promise to complete any project within six months of the end of the year, in either direction."
- "Augustine's XXXV law: The weaker the data available upon which to base one's conclusion, the greater the precision which should be quoted in order to give the data authenticity."
- "Augustine's XXXVI law: The thickness of the proposal required to win a multimillion dollar contract is about one millimeter per million dollars. If all the proposals conforming to this standard were piled on top of each other at the bottom of the Grand Canyon it would probably be a good idea."
- "Augustine's XXXVII law: Ninety percent of the time things will turn out worse than you expect. The other 10 percent of the time you had no right to expect so much."
- "Augustine's XXXVIII law: The early bird gets the worm. The early worm... gets eaten."
- "Betteridge's law of headlines: Any headline that ends in a question mark can be answered by the word no."
- "Brandolini's law: The amount of energy needed to refute bullshit is an order of magnitude bigger than to produce it."
- "Briffault's law: The female, not the male, determines all the conditions of the animal family. Where the female can derive no benefit from association with the male, no such association takes place."
- "Brooks's law: Adding manpower to a late software project makes it later."
- "Celine's First Law: National Security is the chief cause of national insecurity."
- "Celine's Second Law: Accurate communication is possible only in a non-punishing situation."
- "Celine's Third Law: An honest politician is a national calamity."
- "Cheops law: Nothing ever gets built on schedule or within budget."
- "Conway's law: Organizations which design systems are constrained to produce designs which are copies of the communication structures of these organizations."
- "Dilbert principle: The most ineffective workers are systematically moved to the place where they can do the least damage: management."
- "Doctorow's law: Anytime someone puts a lock on something you own, against your wishes, and doesn't give you the key, they're not doing it for your benefit."
- "Dunbar's number: The number of people you can have a meaningful relationship with is limited to about 150."
- "Fun fact: one day you will have to answer for your actions and God may not forgive you."
- "Gall's law: A complex system that works is invariably found to have evolved from a simple system that worked."
- "Gate's law: The speed of software halves every 18 months."
- "Goodhart's law: When a measure becomes a target, it ceases to be a good measure."
- "Hutber's law: Improvement means deterioration."
- "Jevons paradox: Technological progress that increases the efficiency with which a resource is used tends to increase (rather than decrease) the rate of consumption of that resource."
- "Joy's law: No matter who you are, most of the smartest people work for someone else."
- "Kranzberg's 1st law of technology: Technology is neither good nor bad; nor is it neutral."
- "Kranzberg's 2nd law of technology: Invention is the mother of necessity."
- "Kranzberg's 3rd law of technology: Technology comes in packages, big and small."
- "Kranzberg's 4th law of technology: Although technology might be a prime element in many public issues, nontechnical factors take precedence in technology-policy decisions."
- "Kranzberg's 5th law of technology: All history is relevant, but the history of technology is the most relevant."
- "Kranzberg's 6th law of technology: Technology is a very human activity – and so is the history of technology."
- "Lem's Law: No one reads; if someone reads, he doesn't understand; if he understands, he forgets."
- "Maintenance Control: Voiceprint ID: R1-B5."
- "May's law: Software efficiency halves every 18 months, compensating Moore's law."
- "Miller's law: To understand what another person is saying, you must assume that it is true and try to imagine what it could be true of."
- "Mooers's law: An information retrieval system will tend not to be used whenever it is more painful and troublesome for a customer to have information than for him not to have it."
- "Moore's law: The number of transistors on a microchip doubles every two years, though the cost of computers is halved."
- "Napoleon's law: Never interrupt your enemy when he is making a mistake."
- "Newton's flaming laser sword, also known as Alder's razor: What cannot be settled by experiment is not worth debating."
- "Nielsen's law: Network connection speeds for high-end home users will increase by 50% per year."
- "Occam's razor: The simplest explanation is usually the correct one."
- "Ockham's broom: The principle that one can sweep away inconvenient facts by ignoring them."
- "Papert's principle: Some of the most crucial steps in mental growth are based not simply on acquiring new skills, but on acquiring new administrative ways to use what one already knows."
- "Pareto principle: 80% of the effects come from 20% of the causes."
- "Parkinson's law: Work expands so as to fill the time available for its completion."
- "Peter principle: In a hierarchy, every employee tends to rise to their level of incompetence."
- "Sinclair's law: It is difficult to get a man to understand something, when his salary depends upon his not understanding it."
- "Smoking: You smoke to enjoy, I smoke to die."
- "Streisand effect: An attempt to hide, remove, or censor a piece of information has the unintended consequence of publicizing the information more widely."
- "Sturgeon's law: 90% of everything is crap."
- "There are two types of people in this world: thugs and goons. You do not want to be a goon."
- "Wirth's law: Software gets slower faster than hardware gets faster."
- "Zawinski's law: Every program attempts to expand until it can read mail. Those programs which cannot so expand are replaced by ones which can."
