# Builds gusguidry.com with Hugo, indexes it with Pagefind, and publishes it
# to GitHub Pages on every push to master. Drafts never reach this machine:
# drafts/ is git-ignored, so the build only ever sees published content.
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so "revised on" dates come from git

      - name: Install Hugo
        run: |
          wget -qO hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - uses: oven-sh/setup-bun@v2

      - name: Install Pagefind
        run: bun install --frozen-lockfile

      - uses: actions/configure-pages@v5

      - name: Build site
        run: hugo --gc --minify # baseURL comes from hugo.toml (https://gusguidry.com/)

      - name: Build search index
        run: bunx pagefind --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
