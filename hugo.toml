url = "/ja/archive/"
weight = 6

# Drafts live in drafts/ (git-ignored, never pushed) and are mounted into
# content/ so `hugo server -D` still previews them locally. On any machine
# without a drafts/ folder (CI, a fresh clone) Hugo simply skips the mount.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "drafts"
    target = "content"
